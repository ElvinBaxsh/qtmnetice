<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 420" fill="none">
  <defs>
    <filter id="card" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#480060" flood-opacity="0.12"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#480060" flood-opacity="0.18"/>
    </filter>
    <linearGradient id="board" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6b2a8c"/>
      <stop offset="1" stop-color="#3a004d"/>
    </linearGradient>
    <linearGradient id="skull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4b0f63"/>
      <stop offset="1" stop-color="#2a0a38"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2c94c"/>
      <stop offset="1" stop-color="#d8a818"/>
    </linearGradient>
  </defs>

  <!-- fon ləkələri -->
  <circle cx="180" cy="250" r="165" fill="#efdff5" opacity="0.7"/>
  <ellipse cx="318" cy="268" rx="92" ry="118" fill="#faefcc" opacity="0.9"/>
  <circle cx="292" cy="92" r="17" fill="#dcbde8"/>

  <!-- yer kölgəsi -->
  <ellipse cx="220" cy="372" rx="160" ry="16" fill="#c08fd6" opacity="0.35"/>

  <!-- bitki -->
  <g>
    <path d="M66 330 C 64 290, 70 240, 66 190" stroke="#7a2a96" stroke-width="3" stroke-linecap="round"/>
    <path d="M0 0 C 12 -13, 38 -14, 50 0 C 38 14, 12 13, 0 0 Z" fill="#c08fd6" transform="translate(65,300) rotate(-150) scale(1)"/>
    <path d="M0 0 C 12 -13, 38 -14, 50 0 C 38 14, 12 13, 0 0 Z" fill="#a868c4" transform="translate(67,282) rotate(-35) scale(1)"/>
    <path d="M0 0 C 12 -13, 38 -14, 50 0 C 38 14, 12 13, 0 0 Z" fill="#a868c4" transform="translate(65,262) rotate(-148) scale(1.05)"/>
    <path d="M0 0 C 12 -13, 38 -14, 50 0 C 38 14, 12 13, 0 0 Z" fill="#c08fd6" transform="translate(67,242) rotate(-30) scale(1.05)"/>
    <path d="M0 0 C 12 -13, 38 -14, 50 0 C 38 14, 12 13, 0 0 Z" fill="#dcbde8" transform="translate(65,222) rotate(-140) scale(0.95)"/>
    <path d="M0 0 C 12 -13, 38 -14, 50 0 C 38 14, 12 13, 0 0 Z" fill="#a868c4" transform="translate(67,206) rotate(-40) scale(0.9)"/>
    <path d="M0 0 C 12 -13, 38 -14, 50 0 C 38 14, 12 13, 0 0 Z" fill="#c08fd6" transform="translate(65,196) rotate(-95) scale(0.8)"/>
    <path d="M40 328 H 92 L 85 366 Q 66 372 47 366 Z" fill="#dcbde8"/>
    <rect x="36" y="320" width="60" height="11" rx="5.5" fill="#c08fd6"/>
  </g>

  <!-- kitablar (aşağıdan yuxarı) -->
  <g filter="url(#soft)">
    <!-- 1 -->
    <rect x="104" y="316" width="262" height="48" rx="10" fill="#5e1a79"/>
    <rect x="122" y="324" width="238" height="32" rx="5" fill="#ffffff"/>
    <path d="M128 334 H 354 M128 342 H 354 M128 350 H 354" stroke="#efdff5" stroke-width="2"/>
    <rect x="132" y="316" width="10" height="48" fill="#d8a818"/>
    <!-- 2 -->
    <rect x="128" y="270" width="230" height="46" rx="10" fill="#8b4bb0"/>
    <rect x="146" y="278" width="206" height="30" rx="5" fill="#ffffff"/>
    <path d="M152 288 H 346 M152 296 H 346" stroke="#efdff5" stroke-width="2"/>
    <rect x="156" y="270" width="10" height="46" fill="#e5b833"/>
    <!-- 3 -->
    <rect x="112" y="226" width="246" height="44" rx="10" fill="#480060"/>
    <rect x="130" y="233" width="222" height="30" rx="5" fill="#ffffff"/>
    <path d="M136 243 H 346 M136 251 H 346" stroke="#efdff5" stroke-width="2"/>
    <rect x="140" y="226" width="10" height="44" fill="#d8a818"/>
  </g>

  <!-- məzun papağı -->
  <g filter="url(#soft)">
    <path d="M172 196 Q 172 170 236 166 Q 300 170 300 196 L 300 222 Q 236 240 172 222 Z" fill="url(#skull)"/>
    <path d="M236 110 L 350 152 L 236 194 L 122 152 Z" fill="url(#board)"/>
    <path d="M236 110 L 350 152 L 236 160 L 122 152 Z" fill="#7a2a96" opacity="0.35"/>
    <path d="M236 152 Q 300 158 318 176 L 318 214" stroke="url(#gold)" stroke-width="4" stroke-linecap="round" fill="none"/>
    <circle cx="236" cy="152" r="7" fill="#e5b833"/>
    <path d="M311 210 H 325 L 331 250 Q 318 256 305 250 Z" fill="url(#gold)"/>
  </g>

  <!-- süzən kartlar -->
  <g filter="url(#card)">
    <rect x="96" y="58" width="84" height="84" rx="20" fill="#ffffff"/>
    <rect x="118" y="104" width="10" height="20" rx="3" fill="#a868c4"/>
    <rect x="133" y="92" width="10" height="32" rx="3" fill="#7a2a96"/>
    <rect x="148" y="80" width="10" height="44" rx="3" fill="#480060"/>
  </g>
  <g filter="url(#card)">
    <rect x="352" y="172" width="70" height="70" rx="18" fill="#ffffff"/>
    <path d="M372 207 L 384 219 L 404 194" stroke="#7a2a96" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
