; cPanel (PHP-FPM/LSAPI) üçün API-nin PHP ayarları. cPanel → Select PHP Version → Options ilə eyni.
; Qeyd: bəzi hostinqlərdə dəyişikliyin tətbiqi 5 dəqiqəyə qədər çəkir.
upload_max_filesize = 32M
post_max_size = 40M
max_file_uploads = 20
max_execution_time = 120
memory_limit = 256M
display_errors = Off
log_errors = On
expose_php = Off
session.use_strict_mode = 1
session.cookie_httponly = 1
